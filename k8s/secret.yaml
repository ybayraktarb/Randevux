apiVersion: v1
kind: Secret
metadata:
  name: randevux-web-secret
  namespace: default
type: Opaque
stringData:
  # Base env vars that the application requires at runtime
  NODE_ENV: "production"
  
  # Replace these with your actual Supabase credentials in your real cluster
  NEXT_PUBLIC_SUPABASE_URL: "https://<your-project>.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "your-anon-key-here"
  SUPABASE_SERVICE_ROLE_KEY: "your-service-role-key-here"
