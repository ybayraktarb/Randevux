apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: randesk-web-ingress
  namespace: default
  annotations:
    # Example annotations for cert-manager (if you use it)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: app.randesk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: randesk-web-svc
                port:
                  number: 80
  # Uncomment to enable TLS
  # tls:
  #   - hosts:
  #       - app.randesk.com
  #     secretName: randesk-web-tls
